<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Kept in sync with the homepage's useDocumentMeta call in
         src/pages/HomePage.jsx. Prerendering overwrites dist/index.html for
         "/", but this shell still serves any route outside the sitemap, so a
         stale title here contradicts the live one. -->
    <title>Laura Cordrey | I turn your customers into fans</title>
    <meta name="description" content="Your customers are worth more than you're getting. I turn them into fans who stay, spend more and bring others in. Ubisoft, Amazon Games, US Mobile, BlaBlaCar." />
    <meta name="author" content="Laura Cordrey" />
    <meta name="keywords" content="Laura Cordrey, fan-led growth, the Fan Engine™, community strategy, brand strategy, creator programs, premium drops, consulting" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Laura Cordrey" />
    <meta property="og:title" content="Laura Cordrey | I turn your customers into fans" />
    <meta property="og:description" content="Your customers are worth more than you're getting. I turn them into fans who stay, spend more and bring others in. Ubisoft, Amazon Games, US Mobile, BlaBlaCar." />
    <meta property="og:url" content="https://lauracordrey.com/" />
    <meta property="og:image" content="https://lauracordrey.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Laura Cordrey · Fan-led growth for consumer brands" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Laura Cordrey | I turn your customers into fans" />
    <meta name="twitter:description" content="Your customers are worth more than you're getting. I turn them into fans who stay, spend more and bring others in. Ubisoft, Amazon Games, US Mobile, BlaBlaCar." />
    <meta name="twitter:image" content="https://lauracordrey.com/og-image.jpg" />
    <link rel="canonical" href="https://lauracordrey.com/" />

    <!-- Site-wide Person entity, deliberately static.
         Every route used to carry this block, but by accident: the prerenderer
         writes '/' to dist/index.html first, that file is the SPA fallback, and
         useDocumentMeta appended rather than replaced, so the homepage's schema
         leaked into all 18 other snapshots. That leak is now fixed in the hook
         (it clears [data-route-json-ld] first).
         Keeping the entity on every page is genuinely wanted though — it is
         what ties the whole site to one person — so it lives here, in the
         static shell, where it is intentional and cannot be clobbered.
         It carries no data-route-json-ld marker, so the hook leaves it alone.
         @id is set so per-page Person schema (homepage, /about) reconciles to
         this same entity rather than reading as a second person. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://lauracordrey.com/#laura",
        "name": "Laura Cordrey",
        "url": "https://lauracordrey.com",
        "jobTitle": "Fan-led growth for consumer brands. Brand, product, community, growth.",
        "sameAs": ["https://www.linkedin.com/in/lauracordrey/"]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify Forms registration. These hidden static forms exist only so
         Netlify's deploy bot registers the form names + fields; the real UI
         is React (ContactPage, Fan Score). Field names here MUST match what
         the JS submits — unregistered fields are silently dropped. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organisation" />
      <textarea name="message"></textarea>
      <input type="text" name="intent" />
      <input type="text" name="source_page" />
      <input type="text" name="language" />
      <!-- consulting branch -->
      <input type="text" name="consulting_need" />
      <input type="text" name="consulting_timeline" />
      <!-- speaking branch -->
      <input type="text" name="event_date" />
      <input type="text" name="event_format" />
      <input type="text" name="event_location" />
      <input type="text" name="_subject" />
      <input type="text" name="bot-field" />
    </form>
    <form name="fan-score" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="edition" />
      <input type="text" name="score" />
      <input type="text" name="_subject" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
