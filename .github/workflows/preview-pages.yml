# Free preview of the site on GitHub Pages, so the built site can be checked
# without spending Netlify build credits. Actions is free on public repos.
#
# Builds with VITE_BASE=/laura-cordrey-site/ (the router's basename follows
# BASE automatically — see src/main.jsx). Every route is prerendered to its own
# .html file, which Pages serves directly; dist/404.html is the prerendered
# NotFound page.
#
# Preview URL: https://lolacolafola.github.io/laura-cordrey-site/
# Netlify (production) is unaffected — it builds from main at base '/'.
#
# TRACKS `main` SINCE 23 JUL 2026. It tracked `website-rework`, which was
# fast-forwarded into main at the 19 Jul cutover and has had no pushes since.
# The preview was therefore serving a pre-redesign build — the old homepage,
# titled "Fan-led growth for fan-driven brands" — while main moved 20+ commits
# ahead. A preview that silently shows something other than the current site is
# worse than no preview, because it gets checked and believed.
#
# Netlify auto-build is off, so main is not deployed automatically. That makes
# this preview the only always-current view of the built site, which is exactly
# why it should follow main.
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Headless browser for the build-time prerender step (scripts/prerender.mjs).
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_BASE: /laura-cordrey-site/
      # dist/404.html is now the prerendered NotFound page, written by
      # scripts/prerender.mjs — it used to be a copy of the home page made
      # here. Pages serves it for unmatched paths with a real 404, same as
      # Netlify does via public/_redirects.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
